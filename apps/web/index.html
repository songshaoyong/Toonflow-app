<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toonflow</title>
    <script>
      // LAN HTTP is not a secure context, so crypto.randomUUID is missing.
      // Polyfill it before the app bundle checks browser capabilities.
      (() => {
        const cryptoObject = globalThis.crypto || (globalThis.crypto = {});
        if (typeof cryptoObject.randomUUID === "function") return;
        const randomUUID = () => {
          const bytes = new Uint8Array(16);
          if (typeof cryptoObject.getRandomValues === "function") cryptoObject.getRandomValues(bytes);
          else for (let index = 0; index < 16; index += 1) bytes[index] = Math.floor(Math.random() * 256);
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
          return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
        };
        try {
          Object.defineProperty(cryptoObject, "randomUUID", { value: randomUUID, configurable: true });
        } catch {
          cryptoObject.randomUUID = randomUUID;
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
